<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>GPT 侧边栏</title><link rel="stylesheet" href="style.css"></head><body style="height:auto;max-width:720px;margin:60px auto;padding:24px"><h1>GPT 侧边栏</h1><p>在 Edge 侧栏使用自己的 ChatGPT 账号，无需本地辅助程序，也无需打开 Codex。</p><p><button id="open">打开右侧 GPT 栏</button></p><p>在右侧点击 Continue with ChatGPT，然后在 OpenAI 官方页面亲自完成登录和授权。</p><p>登录成功后点击「刷新模型」，发送一句简单的测试问题即可。</p><hr><h2>右键选文</h2><p id="sample">电子在周期势中运动时，可以用布洛赫波描述其量子态。</p><p>选中上面这句话，右键点击「发送到 GPT 侧边栏」。文字只进入草稿，不会自动发送。</p><p id="status" role="status"></p><script type="module" src="welcome.js"></script></body></html>
